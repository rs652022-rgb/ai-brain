plugins { id 'com.android.application' }

android {
    namespace 'app.aibrain.brain'
    compileSdk 34
    defaultConfig {
        applicationId 'app.aibrain.brain'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
        buildConfigField 'String', 'DEFAULT_URL', "\"${project.findProperty('brainUrl') ?: ''}\""
    }
    buildFeatures { buildConfig true }
    // Same signing key on every build (so updates install over the old app): set it up once with
    // GitHub secrets, see android/README.md. Without them each build gets its own debug key.
    def ks = System.getenv('BRAIN_KEYSTORE_FILE')
    if (ks) {
        signingConfigs {
            brain {
                storeFile file(ks)
                storePassword System.getenv('BRAIN_KEYSTORE_PASSWORD')
                keyAlias 'brain'
                keyPassword System.getenv('BRAIN_KEYSTORE_PASSWORD')
            }
        }
        buildTypes { debug { signingConfig signingConfigs.brain } }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions { jniLibs { useLegacyPackaging true } }
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
