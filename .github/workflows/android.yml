# Builds the Brain Android app: your Brain full screen, plus the always-listening activation word,
# phone control (Accessibility) and offline commands. An APK you install directly; no Play Store needed.
# Actions tab → "Build Android app" → Run workflow (the address is optional: you can type it in the app).
name: Build Android app

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Your Brain's address (optional, can be set in the app)"
        required: false
        default: ""
  push:
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Signing key (optional, from secrets)
        env:
          KEYSTORE_B64: ${{ secrets.BRAIN_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/brain.jks"
            echo "BRAIN_KEYSTORE_FILE=$RUNNER_TEMP/brain.jks" >> "$GITHUB_ENV"
          fi
      - name: Build the APK
        env:
          BRAIN_KEYSTORE_PASSWORD: ${{ secrets.BRAIN_KEYSTORE_PASSWORD }}
          SERVER_URL: ${{ inputs.server_url }}
        run: |
          gradle -p android assembleDebug --no-daemon -q -PbrainUrl="$SERVER_URL"
          cp android/app/build/outputs/apk/debug/app-debug.apk Brain.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Brain-android
          path: Brain.apk

  emulator-check:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Brain-android
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python tests/android_e2e.py Brain.apk
