# Builds the AI Brain desktop app (the whole Brain in its own window) for Windows, macOS and Linux, free on GitHub Actions.
# Run it from the Actions tab ("Run workflow"), or push a tag like desktop-v1.0.0 to publish a release.
name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pyinstaller
      - name: Test the Brain first
        shell: bash
        run: |
          pip install pytest
          python -m pytest -q -x tests/test_brain.py tests/test_phase1.py
      - name: Build
        shell: bash
        run: bash desktop/build.sh
      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:APP_VERSION = if ("${{ github.ref_name }}" -like "desktop-v*") { "${{ github.ref_name }}".Substring(9) } else { "1.0.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" desktop\installer.iss
      - name: Package (macOS disk image)
        if: runner.os == 'macOS'
        run: |
          plutil -insert NSMicrophoneUsageDescription -string "AI Brain listens for your activation word on this Mac (offline)." dist/AIBrain.app/Contents/Info.plist
          codesign --force --deep -s - dist/AIBrain.app
          mkdir -p out dmg && cp -R dist/AIBrain.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "AI Brain" -srcfolder dmg -ov -format UDZO out/AIBrain-macOS.dmg
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: mkdir -p out && tar -czf out/AIBrain-Linux.tar.gz -C dist AIBrain
      - uses: actions/upload-artifact@v4
        with:
          name: AIBrain-${{ runner.os }}
          path: out/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/*
